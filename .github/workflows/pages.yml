# Publishes this folder to GitHub Pages on every push to main (no build step; the page is prebuilt on the Mac mini).
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes can't find the just-uploaded artifact yet ("No artifacts named github-pages"): give it a moment (2026-11-21)
      - name: Wait for the artifact to register
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
