    var sh = e.target.closest('#savehide'); if (sh) { saveHidden = true; sb.hidden = true; try { localStorage.setItem(HKEY, '1'); } catch (err) {} if (/^#save/.test(location.hash)) location.hash = '#home'; else render(); return; }
    var c = e.target.closest('[data-copy]');
    if (c) {
      var txt = c.getAttribute('data-copy');
      var done = function () { c.textContent = 'Copied'; setTimeout(function () { c.textContent = 'Copy link'; }, 2000); };
      var sel = function () { var code = c.parentNode.querySelector('code'); var r = document.createRange(); r.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Selected: copy it'; };
      try { navigator.clipboard.writeText(txt).then(done, sel); } catch (err) { sel(); }
    }
  });
  app.addEventListener('toggle', function (e) { var d = e.target; if (d.classList && (d.classList.contains('wfold') || d.classList.contains('pastfold') || d.classList.contains('evfold'))) OPEN[d.getAttribute('data-k')] = d.open; }, true);
  var NAVN = 0;
  window.addEventListener('hashchange', function () { NAVN++; });
  window.addEventListener('hashchange', render);
  document.addEventListener('touchstart', function () {}, { passive: true });
  /* Stay current (Neil, 2026-11-15): the home-screen app keeps the old page open, so check for a newer published version
     when the app opens or comes back to the front, and every 5 minutes while open (every minute while live updates run: Neil, 2026-11-17).
     Favorites and settings are kept (saved on the phone). Reads only the top of the page, where the build stamp is. */
  (function () {
    var mine = (document.querySelector('meta[name=build]') || {}).content;
    if (!mine || !window.fetch) return;
    var busy = false, last = 0;
    function check(force) {
      if (busy || (!force && Date.now() - last < 60000)) return;
      busy = true; last = Date.now();
      fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=0-4095' } }).then(function (r) { return r.text(); }).then(function (t) {
        var m = t.match(/<meta name="build" content="(\d+)"/);
        if (m && m[1] > mine) location.reload();
      }).catch(function () {}).then(function () { busy = false; });
    }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(true); });
    window.addEventListener('pageshow', function () { check(true); });
    function live() { return !isNaN(NEXT) && Date.now() < NEXT + 15 * 60000; }   /* a refresh is scheduled: an event is being updated */
    setInterval(function () { if (document.visibilityState === 'visible' && (live() || Date.now() - last >= 300000)) check(false); }, 60000);
    setTimeout(function () { check(true); }, 3000);
  })();
  /* No picking up and dragging links or images on a long press (Neil, 2026-11-15) */
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
  new MutationObserver(function () { document.querySelectorAll('a:not([draggable]), img:not([draggable])').forEach(function (el) { el.setAttribute('draggable', 'false'); }); }).observe(document.documentElement, { childList: true, subtree: true });   /* lets iPhone show the pushed-in key */
  /* Keep favorites and open rows across page updates: the viewer hands this state back after each new version loads. */
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { favs: FAVS.slice(), open: Object.assign({}, OPEN), saveHidden: saveHidden }; }); } catch (e) {}
  function boot(data) {
    try {
      if (data && Array.isArray(data.favs)) {
        data.favs.forEach(function (f) { if (FAVS.indexOf(f) < 0) FAVS.push(f); });
        try { localStorage.setItem(FKEY, JSON.stringify(FAVS)); } catch (e) {}
      }
      if (data && data.open) Object.keys(data.open).forEach(function (k) { OPEN[k] = data.open[k]; });
      if (data && data.saveHidden) { saveHidden = true; sb.hidden = true; try { localStorage.setItem(HKEY, '1'); } catch (e) {} }
    } catch (e) {}
    render();
  }
  try {
    var hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
  } catch (e) { render(); }
})();
</script>
